# terminu family template (tdp project/goreleaser.yaml), copied to an app's
# .goreleaser.yaml. Replace sshu with the app's name and fill the lines
# marked "app:". An app with a Windows build uncomments the lines marked
# "Windows"; nothing else changes.
version: 2

project_name: sshu

builds:
  - main: ./cmd/sshu
    binary: sshu
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # internal/version.Version takes the tag without its v; the app prints
      # it with the v (internal/version.Display). ModulePath is go.mod's
      # module, its /vN included from v2 on.
      - -s -w -X {{ .ModulePath }}/internal/version.Version={{.Version}}
    goos:
      # unix-first: no Windows build unless the app needs one.
      - linux
      - darwin
      # - windows   # Windows
    goarch:
      - amd64
      - arm64
    # app: the os/arch pairs this app cannot build, each as
    #   - goos: linux
    #     goarch: arm64
    # or none.
    ignore: []

archives:
  - formats:
      - tar.gz
    # format_overrides:   # Windows
    #   - goos: windows
    #     formats:
    #       - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# The release notes come from CHANGELOG.md (.github/workflows/release.yml).
changelog:
  disable: true

# A tag with a pre-release part (v1.2.0-beta.1) makes a GitHub pre-release.
release:
  prerelease: auto

# A formula, not a cask: a formula binary is never stamped
# com.apple.quarantine, so an unsigned binary runs clean.
brews:
  - repository:
      owner: vulcanshen
      name: homebrew-tap
      # One token for everything, GITHUB_TOKEN (user, 2026-09-25): a release
      # run by hand takes the shell's; the workflow hands it the PAT in
      # ACTION_TOKEN when one is set, since the built-in token cannot write
      # to the tap repository.
      token: "{{ .Env.GITHUB_TOKEN }}"
    # A pre-release never reaches the tap: brew keeps the stable release.
    skip_upload: auto
    homepage: "https://github.com/vulcanshen/sshu"
    # app: one line, what the app is, ending in (terminu family).
    description: "sshu: an ssh and sftp front end for the terminal (terminu family)"
    # app: what to run first, where the settings and data live, the Nerd
    # Font and truecolor requirements, the platforms.
    caveats: |
      Run `sshu` to start.

      Hosts, credentials and the logs live in ~/.sshu ($SSHU__DATA when that
      is set), the settings in ~/.config/sshu ($XDG_CONFIG_HOME/sshu, or
      $SSHU__CONFIG). The SSH screen runs the system's OpenSSH client.

      A Nerd Font terminal profile and a truecolor (24-bit) terminal are
      required. macOS and Linux (WSL too).
    # app: dependencies, when the app calls other programs.
    test: |
      system "#{bin}/sshu", "version"

